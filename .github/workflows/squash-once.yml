name: squash-once
on:
  push:
    paths:
      - .github/workflows/squash-once.yml
  workflow_dispatch:
jobs:
  squash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-157217-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Soft-squash to single clean commit
        env:
          GIT_AUTHOR_NAME: Kailash Nelson
          GIT_AUTHOR_EMAIL: 37966146+KingLizard1020@users.noreply.github.com
          GIT_COMMITTER_NAME: Kailash Nelson
          GIT_COMMITTER_EMAIL: 37966146+KingLizard1020@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "Kailash Nelson"
          git config user.email "37966146+KingLizard1020@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/python/cpython.git"
          git fetch --no-tags upstream main
          MB=$(git merge-base HEAD "upstream/main")
          echo "merge-base=$MB"
          git reset --soft "$MB"
          rm -f ".github/workflows/squash-once.yml" || true
          rm -f ".github/workflows/apply-review-fix.yml" || true
          find . -maxdepth 3 -name '.cursor-*' -type f -delete 2>/dev/null || true
          git add -A
          git rm -f --ignore-unmatch .github/workflows/squash-once.yml .github/workflows/apply-review-fix.yml || true
          echo "" | base64 -d > /tmp/commit_msg.txt
          if git diff --cached --quiet; then
            echo "ERROR: empty index after soft reset" >&2
            exit 1
          fi
          git commit -F /tmp/commit_msg.txt
          git log -1 --format=fuller
          git push --force origin "HEAD:gh-157217-fix"
